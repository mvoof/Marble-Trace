name: Build App on PR

# The preview build is asked for, never automatic: a PR shows no pending
# check until someone wants an installer. Adding the `build` label to a PR
# builds it — only a maintainer can label, so the label is the approval — and
# adding it again after new commits builds those. Run workflow on a branch
# does the same; the preview comment finds the PR by commit either way.
on:
  pull_request:
    branches: [main]
    types: [labeled]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-changes:
    name: Check Changes
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build'
    runs-on: ubuntu-latest
    outputs:
      # A run asked for by hand builds whatever the branch holds.
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.js == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for file changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: .github/filters.yml

  build-app:
    name: Build Preview
    needs: check-changes
    if: needs.check-changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          node-version: '20'
          platform: ${{ matrix.platform }}
          cache-rust: 'true'

      - name: Build Tauri App
        run: npm run tauri:build:dev

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-build
          path: src-tauri/target/release/bundle/
          compression-level: 6
          if-no-files-found: warn

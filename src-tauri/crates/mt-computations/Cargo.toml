[package]
name = "mt-computations"
description = "Pure processors: every computed frame, from the model's frames alone."
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mt-model.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
irating.workspace = true
specta = { workspace = true, optional = true }

[dev-dependencies]
# The Safety Rating reference vectors sit on band floors, where one ulp decides
# the band: the default parser rounds some of their numbers off by one.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[features]
dev = ["dep:specta", "mt-model/dev"]
# Constructors other crates' tests build state with; never in a release build.
test-util = []

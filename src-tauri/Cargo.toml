[package]
name = "marble-trace"
version = "0.21.0"
description = "Marble Trace - iRacing Telemetry Overlay"
authors = ["mvoof"]
license = "MIT"
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "marble_trace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
dotenvy = "0.15"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_repr = "0.1"
tauri = { version = "2.10", features = ["protocol-asset"] }
kerb = { version = "0.3.0", default-features = false, features = ["iracing"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-mcp-bridge = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-aptabase = "1.0.0"
sys-locale = "0.3"
specta = { version = "2.0.0-rc.22", features = ["derive"], optional = true }
specta-typescript = { version = "0.0.9", optional = true }
specta-serde = { version = "0.0.9", optional = true }
serde_yaml_ng = "0.10"
bitflags = "2"
# Stream chat: Twitch IRC rides a WebSocket, YouTube InnerTube is plain HTTP.
# rustls throughout so no OpenSSL toolchain is needed on Windows builds.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
# OAuth tokens go to the Windows Credential Manager, never to settings.json.
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Remote widgets: the same overlay bundle served over the LAN so a tablet can
# render a layout screen in a browser. axum rides the tokio runtime the
# telemetry thread already needs, so no second runtime is started.
axum = { version = "0.8", features = ["ws"] }
local-ip-address = "0.6"

# Global button bindings read wheels and button boxes through DirectInput8 —
# the only Windows API that still reports device input while the sim holds
# foreground focus. DirectInput lives under Devices::HumanInterfaceDevice in
# windows-rs, not under a DirectInput-named feature.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
dev = [
    "dep:specta",
    "dep:specta-typescript",
    "dep:specta-serde",
]
